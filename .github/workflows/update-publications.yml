name: Update Google Scholar publications

on:
  schedule:
    - cron: '0 3 * * *' # daily at 03:00 UTC
  workflow_dispatch: # lets you run it manually from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install parser
        run: npm install --no-save cheerio@1.0.0-rc.12

      - name: Fetch publications from Google Scholar
        run: node scripts/fetch-scholar.mjs
        env:
          SCHOLAR_USER_ID: NixBC9MAAAAJ

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/publications.json
          git diff --cached --quiet || (git commit -m "chore: update Google Scholar publications" && git push)